name: Release

# Push d'un tag annoté vX.Y.Z -> build + signature + release GitHub
# avec l'APK en asset et le message du tag comme release note.
# Lancé à la main (workflow_dispatch) : même build signé, sans release —
# de quoi vérifier la chaîne sans avoir à tagguer.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # JDK 21 pour faire tourner Gradle ; le bytecode reste en 17
      # (compileOptions / jvmTarget de app/build.gradle.kts). Pas 25 :
      # Gradle 8.11 ne tourne pas dessus.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # v5 et pas v6 : la v6 soumet son cache à des conditions d'utilisation
      # propriétaires de Gradle. La v5 tourne déjà sur Node 24.
      - uses: gradle/actions/setup-gradle@v5

      # Secrets requis : KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Keystore de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Tests + APK release signé
        run: ./gradlew test assembleRelease

      - name: Créer la release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/GlyphSlot-*.apk \
            --title "GlyphSlot $GITHUB_REF_NAME" \
            --verify-tag \
            --notes-from-tag
